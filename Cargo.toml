[package]
name = "llms-wiki"
version = "0.6.3"
edition = "2024"
description = "Mirror llms.txt Markdown sites locally"
repository = "https://github.com/yigegongjiang/jj-llms-txt-wiki"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.53.0", default-features = false }
fs2 = "0.4.3"
humantime = "2.3.0"
indicatif = "0.18.6"
jiff = { version = "0.2.32", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.2"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["io-util", "net"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
