# 镜像内容 = 第三方公开文档, 正常文本会被 secret scanning 误判并拒绝 push
# 例: huggingface 的 `Mistral3ForConditionalGeneration` 恰为 32 位字母数字 -> 命中 Mistral AI API Key 模式
# 只在默认分支生效, 作用于全仓库所有分支的 push; 源码扩展名 (rs/toml/sh/yml) 不在排除内
paths-ignore:
  - "*.md"
  - "**/*.md"
  - "*.txt"
  - "**/*.txt"
  - "*.json"
  - "**/*.json"
